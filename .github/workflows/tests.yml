name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: unittest and compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"
      - name: Install mutagen
        run: python -m pip install mutagen
      - name: Compile check
        run: python -m py_compile *.py tests/*.py
      - name: Shell syntax check
        run: bash -n install.sh
      - name: Offline safety tests
        run: python -m unittest discover -s tests -v
